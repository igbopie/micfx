# micfx — parameters editable without recompiling (read at startup)
# Format: key value (floats).

# Per-channel gain (linear, 1.0 = 0 dB)
mic1_gain 1.0
mic2_gain 1.0

# Per-channel high-pass (Hz; 0 = bypass)
hpf_frequency 0

# Per-channel compressor (ratio 1.0 = bypass)
compressor_threshold 1.0
compressor_ratio 1.0
compressor_attack 0.005
compressor_release 0.100

# EQ (0.0 dB = bypass)
eq_low 0.0
eq_mid 0.0
eq_high 0.0

# Shared reverb (0.0 = bypass)
reverb_send_1 0.0
reverb_send_2 0.0
reverb_amount 0.0

# Delay/echo (mix 0.0 = bypass)
delay_ms 0.0
delay_feedback 0.0
delay_mix 0.0

# Output
master_gain 1.0
limiter_threshold 1.0
