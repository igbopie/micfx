# micfx — parámetros editables sin recompilar (etapa 1: solo gains + master)
# Formato: clave valor (floats). El DSP los lee al arrancar.

# Ganancia por canal (lineal, 1.0 = 0 dB)
mic1_gain 1.0
mic2_gain 1.0

# High-pass por canal (Hz; 0 = bypass). Etapas futuras.
hpf_frequency 0

# Compresor por canal (etapas futuras; 1.0 = bypass)
compressor_threshold 1.0
compressor_ratio 1.0
compressor_attack 0.005
compressor_release 0.100

# EQ (etapas futuras; 0.0 dB = bypass)
eq_low 0.0
eq_mid 0.0
eq_high 0.0

# Reverb compartida (etapas futuras; 0.0 = bypass)
reverb_send_1 0.0
reverb_send_2 0.0
reverb_amount 0.0

# Delay/echo (etapas futuras; 0.0 = bypass)
delay_ms 0.0
delay_feedback 0.0
delay_mix 0.0

# Salida
master_gain 1.0
limiter_threshold 1.0
